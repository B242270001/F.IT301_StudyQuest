# StudyQuest: backend (+ frontend build) ба MongoDB
#   docker compose up --build -d     → http://localhost:4000
#   docker compose down              → зогсоох (өгөгдөл mongo-data volume-д хадгалагдана)
#   docker compose down -v           → өгөгдлийг бүр мөсөн устгах
# JWT_SECRET-ийг .env файлд эсвэл орчны хувьсагчаар өгнө (доорх default нь зөвхөн туршилтад).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/studyquest
      JWT_SECRET: ${JWT_SECRET:-studyquest-docker-demo-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  mongo-data:
